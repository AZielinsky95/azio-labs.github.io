<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Return to Bento</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f7f7f5;
        color: #1c1c1e;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        padding: 2.5rem 1.75rem;
      }
      .check {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 50%;
        background: #34c759;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .check svg {
        width: 1.75rem;
        height: 1.75rem;
        stroke: #fff;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #6e6e73;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
      </div>
      <h1>Bank sign-in complete</h1>
      <p>
        Return to the <strong>Bento</strong> app to finish connecting your
        account. You can close this page.
      </p>
    </div>
  </body>
</html>
